# config/proxy_config.yaml

# Global Proxy Configuration for Multi-Regional Ingestion
# Used to bypass regional bias and simulate "Global" audience behavior.

enabled: true

# Regional Pools
regions:
  us:
    # pool: ["http://user:pass@us-proxy1.com:8080", "http://user:pass@us-proxy2.com:8080"]
    pool: [] # User to populate with VPN/Proxy credentials
  eu:
    pool: []
  global:
    pool: []

# Default Region for Discovery
default_region: "global"

# Rotation Strategy: random | sequential
rotation_strategy: "random"
