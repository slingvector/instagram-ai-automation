version: "3.8"

# MCR Publishing Edge — Appium Docker Service
# WiFi mode: uses host ADB server (Mac: host.docker.internal works out-of-box)
# To connect device: run `adb connect <device-ip>:5555` on your host first
# USB mode fallback: uncomment the USB volumes and remove ADB_SERVER_SOCKET

services:
  appium:
    image: appium/appium:latest
    container_name: mcr-appium
    ports:
      - "4723:4723"
    environment:
      # WiFi mode: forward container ADB to host ADB daemon
      - RELAXED_SECURITY_ENABLED=true
      - ADB_SERVER_SOCKET=tcp:host.docker.internal:5037
    extra_hosts:
      # Required on Linux; Mac handles this automatically
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared ADB auth keys — avoids re-prompting "Trust this computer?" on device
      - ~/.android:/root/.android
      # USB mode fallback (uncomment if using wired connection instead):
      # - /dev/bus/usb:/dev/bus/usb
    # privileged: true   # Only needed for USB mode — keep commented for WiFi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4723/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
