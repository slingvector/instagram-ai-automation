[project]
name = "mcr"
version = "0.1.0"
description = "ModernOS Content Relay - Instagram AI Automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.42.0",
    "playwright-stealth==1.0.6",
    "requests==2.31.0",
    "python-dotenv==1.0.1",
    "yt-dlp>=2024.1.1",
    "Pillow>=10.0.0",
    "APScheduler>=3.10.0",
    "pyyaml>=6.0",
    "feedparser>=6.0.10",
    "pytrends>=4.9.2",
    "google-api-python-client>=2.0.0",
    "telethon>=1.34.0",
    "google-cloud-firestore>=2.14.0",
    "google-cloud-storage>=2.14.0",
    "google-generativeai>=0.5.0",
    "google-cloud-logging>=3.8.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "web3>=6.15.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "opencv-python>=4.8.0",
    "openai>=1.0.0",
    "google-cloud-aiplatform>=1.38.0",
    "flask>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
