# Trending Sources Config
# Used by UC3 TrendingAdapter. Add/remove sources freely.

# ── Reddit (no API key needed) ────────────────────────────────────────────────
reddit:
  enabled: true
  subreddits:
    - "videos"
    - "funny"
    - "sports"
    - "fashion"
    - "travel"
    - "entertainment"
  min_score: 5000          # Reddit upvotes threshold
  time_filter: "day"       # 'hour' | 'day' | 'week'

# ── Google Trends (pytrends — no key needed) ──────────────────────────────────
google_trends:
  enabled: true
  geo: "US"                # Country code
  timeframe: "now 1-d"     # Last 24h

# ── YouTube Trending (requires YOUTUBE_API_KEY in .env) ───────────────────────
youtube:
  enabled: true
  region_code: "US"
  category_ids:            # YouTube video category IDs
    - 17    # Sports
    - 23    # Comedy
    - 24    # Entertainment
    - 26    # How-to & Style (fashion)
    - 19    # Travel & Events
  max_results: 20

# ── RSS News Feeds ────────────────────────────────────────────────────────────
rss:
  enabled: true
  feeds:
    - name: "BBC World"
      url: "http://feeds.bbci.co.uk/news/rss.xml"
    - name: "Reuters"
      url: "https://feeds.reuters.com/reuters/topNews"
    - name: "AP News"
      url: "https://rsshub.app/apnews/topics/apf-topnews"
    - name: "Al Jazeera"
      url: "https://www.aljazeera.com/xml/rss/all.xml"

# ── Telegram Public Channels (requires TELEGRAM_API_ID, TELEGRAM_API_HASH) ────
telegram:
  enabled: false           # Enable when Telegram credentials configured
  channels:
    - "@breakingnews"
    - "@sports_world"
