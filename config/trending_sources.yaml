# config/trending_sources.yaml

# Configuration for UC3: Real-Time Trending Monitor
# Centralizes viral trends from multi-platform sources to generate reaction or text-card Reels.

sources:
  reddit:
    # Subreddits to monitor for viral video or text content
    - "all"
    - "funny"
    - "damnthatsinteresting"
    - "news"
    
  youtube:
    # Specific youtube trending endpoints or channel IDs
    - "trending"
    
  rss:
    # Standard news and Google Trends RSS feeds for text-card generation
    # The adapter will assign a generic B-roll background video for these.
    - "https://trends.google.com/trends/trendingsearches/daily/rss?geo=US"
    - "http://feeds.bbci.co.uk/news/rss.xml"
    
filters:
  reddit_min_upvotes: 20000
