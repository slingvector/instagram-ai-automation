# config/creator_watchlist.yaml

# Top Creator Watchlist for generic content (UC2)
# The ingestor will scrape these profiles for new high-performing Reels.
# Limits control the minimum engagement criteria for parsing.

filters:
  min_views: 500000      # 500K
  min_likes: 10000
  posted_within_days: 7
  max_duration_seconds: 90

creators:
  fashion:
    - "wisdm"
    - "thefashioncouple"
    - "teachingmensfashion"
    
  travel:
    - "beautifuldestinations"
    - "earthofficial"
    - "taramilktea"
    
  entertainment:
    - "netflix"
    - "complex"
    - "pubity"
    
  sport:
    - "houseofhighlights"
    - "espn"
    - "sportscenter"
    
  fun:
    - "daquan"
    - "fuckjerry"
    - "kalesalad"
